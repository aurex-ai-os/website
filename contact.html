<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact | Aurex</title><meta name="description" content="Contact Aurex for support, refund requests, press or security reports."><link rel="canonical" href="https://YOUR-DOMAIN/contact.html"><meta name="robots" content="index, follow"><link rel="icon" href="aurex_favicon.jpeg"><style>body{margin:0;background:#0B0B0D;color:#EDEDF0;font:16px/1.7 Inter,system-ui,sans-serif}main{max-width:620px;margin:0 auto;padding:56px 24px}a{color:#8aa4ff}h1{font:300 40px Georgia,serif;letter-spacing:-.02em}p,label{color:#B9B9C2}nav{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:40px;font-size:14px}input,select,textarea{width:100%;box-sizing:border-box;background:#131316;border:1px solid #26262B;border-radius:12px;color:#EDEDF0;padding:12px 14px;font:inherit;margin:6px 0 18px}textarea{min-height:150px;resize:vertical}button{background:#EDEDF0;color:#0B0B0D;border:0;border-radius:999px;padding:13px 28px;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}button:disabled{opacity:.5}#status{margin-top:16px;min-height:24px}.hp{position:absolute;left:-9999px}small{color:#8F8F98}</style></head><body><main>
<nav><a href="./">Aurex</a><a href="about.html">About</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="refund.html">Refunds</a><a href="contact.html">Contact</a></nav>
<h1>Contact</h1><p>Send us a message and a person will read it. Add your email if you would like a reply.</p>
<form id="f" novalidate>
<label for="topic">Topic</label>
<select id="topic"><option value="support">Support</option><option value="refund">Refund request</option><option value="press">Press or partnership</option><option value="security">Security report</option><option value="other">Other</option></select>
<label for="email">Your email (optional, only used to reply)</label>
<input id="email" type="email" maxlength="254" autocomplete="email">
<label for="msg">Message</label>
<textarea id="msg" maxlength="4000" required></textarea>
<input class="hp" id="site" tabindex="-1" autocomplete="off" aria-hidden="true">
<button id="btn" type="submit">Send message</button>
<p id="status" role="status"></p>
</form>
<p><small>For refunds, include the email you used to buy. We do not share your message or email with anyone.</small></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://uochogmoqtpafxinhlml.supabase.co", "sb_publishable_vPGN235pih0S_O-c5XFKqQ_Iq5JPIaK");
const opened = Date.now();
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const st = document.getElementById('status'), btn = document.getElementById('btn');
  const message = document.getElementById('msg').value.trim();
  const email = document.getElementById('email').value.trim();
  if (document.getElementById('site').value || Date.now() - opened < 3000) { st.textContent = 'Message sent. Thank you.'; return; }
  if (message.length < 5) { st.textContent = 'Please write a little more.'; return; }
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { st.textContent = 'That email address does not look right.'; return; }
  btn.disabled = true; st.textContent = 'Sending...';
  const { error } = await sb.from('contact_messages').insert({ topic: document.getElementById('topic').value, email: email || null, message });
  if (error) { st.textContent = 'Sorry, that did not send. Please try again in a moment.'; btn.disabled = false; return; }
  st.textContent = 'Message sent. Thank you.'; document.getElementById('f').reset();
});
</script></body></html>
