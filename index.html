<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurex - Cognitive Operating System</title>
    <!-- Custom Aurex Favicon -->
    <link rel="icon" type="image/jpeg" href="./aurex_favicon.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        aesBase: 'var(--aes-base)',
                        aesSurface: 'var(--aes-surface)',
                        aesText: 'var(--aes-text)',
                        aesMuted: 'var(--aes-muted)',
                        aesBorder: 'var(--aes-border)',
                        aesAccent: 'var(--aes-accent)',
                        aesInvBase: 'var(--aes-inv-base)',
                        aesInvText: 'var(--aes-inv-text)',
                        aesSuccess: 'var(--aes-success)',
                        aesError: 'var(--aes-error)'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --aes-base: #F9F8F4; 
            --aes-surface: #FFFFFF; 
            --aes-text: #1C1C1A; 
            --aes-muted: #7A7A75; 
            --aes-border: #E8E6E1; 
            --aes-accent: #D2CFC4; 
            --aes-inv-base: #1C1C1A;
            --aes-inv-text: #F9F8F4;
            --aes-success: #2e4a35;
            --aes-error: #662b2b;
        }

        html.dark {
            --aes-base: #1A1A18; 
            --aes-surface: #222220; 
            --aes-text: #F2F0E9; 
            --aes-muted: #9E9C96; 
            --aes-border: #333330; 
            --aes-accent: #40403C; 
            --aes-inv-base: #F2F0E9; 
            --aes-inv-text: #1A1A18; 
            --aes-success: #a3c4ab;
            --aes-error: #d18a8a;
        }

        body { 
            background-color: var(--aes-base); 
            color: var(--aes-text);
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.5s ease, color 0.5s ease;
            scroll-behavior: smooth;
        }

        div, section, header, footer, nav, button, p, h1, h2, h3, span, ul, li {
            transition: background-color 0.5s ease, border-color 0.5s ease, color 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        const FAQS = [
            {
                q: "If it's BYOK, why shouldn't I just use a free open-source agent like OpenClaude?",
                a: "You absolutely can, if you love managing Python environments, debugging dependency conflicts, and reading terminal outputs. We built Aurex for people who want the power of a local AI agent wrapped in a stunning, stable, native desktop UI. Aurex gives you our proprietary Model Router, a visual RAG file manager, and the native Trust Layer (approval GUI) out-of-the-box. You are paying for the execution, the safety, and the seamless workflow."
            },
            {
                q: "Does Aurex store my files, or train its AI on my codebase and study notes?",
                a: "Absolutely not. Aurex is a local-first OS. Your files, knowledge graphs, and RAG databases live entirely on your local hard drive. We have no servers storing your data, meaning we physically cannot read your files or train models on them. Furthermore, because you use your own API keys (BYOK), providers like OpenAI and Anthropic are legally bound by their API terms not to train on your data."
            },
            {
                q: "Do I need an expensive PC or a massive GPU to run Aurex?",
                a: "No. Aurex itself is extremely lightweight. Because you are using API keys (BYOK) to connect to Claude or OpenAI, their massive supercomputers do the heavy lifting. Aurex just orchestrates the context and UI locally. It runs perfectly on a standard MacBook Air or a basic Windows laptop. (Note: If you choose to route tasks to local offline models via Ollama, a dedicated GPU is recommended but totally optional)."
            },
            {
                q: "If I’m paying for the Aurex subscription and my own API keys, won't this get super expensive?",
                a: "Actually, BYOK is mathematically cheaper than standard AI subscriptions. Most users spend less than $2 to $5 a month on API costs. Why? Because Aurex uses our proprietary Model Fabric Router. It automatically routes simple tasks (like organizing files or generating flashcards) to incredibly cheap models (like GPT-4o-mini or Llama 3), and only spends your pennies on expensive models (like Claude 3.5 Sonnet) when you ask it to write complex code."
            },
            {
                q: "I’ve seen AI agents hallucinate. Can Aurex accidentally delete my files or ruin my codebase?",
                a: "No. This is exactly why we built the Trust Layer. Aurex operates in a strict sandbox. Before it executes any destructive terminal command, modifies a file, or pushes code, the UI pauses and presents you with a visual diff of its plan. It physically cannot execute the action until you click the [Approve] button. You have absolute control."
            },
            {
                q: "What happens to my subscription when Aurex exits Beta and V1.0 launches?",
                a: "If you subscribe today, your price is locked in forever. When V1.0 launches, the public prices for the Student and Pro tiers will increase significantly. By joining the Beta now, you are 'grandfathered' into this heavily discounted rate for the lifetime of your account."
            }
        ];

        const App = () => {
            const [isDark, setIsDark] = useState(false);
            const [toast, setToast] = useState(null);
            const [ghostStatus, setGhostStatus] = useState('pending');
            const [billing, setBilling] = useState('monthly'); 
            const [faqOpen, setFaqOpen] = useState(null);
            const [lightboxOpen, setLightboxOpen] = useState(false);

            useEffect(() => {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    setIsDark(true);
                }
            }, []);

            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                
                if (lightboxOpen) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'auto';
                }
            }, [isDark, lightboxOpen]);

            useEffect(() => {
                const initWaitlist = () => {
                    const form = document.getElementById("waitlist-form");
                    const emailInput = document.getElementById("waitlist-email");
                    const submitBtn = document.getElementById("waitlist-btn");
                    const statusMsg = document.getElementById("waitlist-status");

                    if (form && !form.hasAttribute('data-bound')) {
                        form.setAttribute('data-bound', 'true');
                        form.addEventListener("submit", async (e) => {
                            e.preventDefault();
                            const email = emailInput.value.trim().toLowerCase();

                            if (!email) return;

                            submitBtn.disabled = true;
                            const originalBtnText = submitBtn.innerText;
                            submitBtn.innerText = "Securing Spot...";
                            if (statusMsg) statusMsg.innerText = "";

                            try {
                                const { error } = await window.supabase
                                    .from("waitlist")
                                    .insert([{ email: email }]);

                                if (error) {
                                    if (error.code === "23505") {
                                        statusMsg.className = "text-[#d18a8a] text-[10px] mt-2 font-mono leading-tight";
                                        statusMsg.innerText = "You're already on the VIP Beta waitlist!";
                                    } else {
                                        throw error;
                                    }
                                } else {
                                    statusMsg.className = "text-[#a3c4ab] text-[10px] mt-2 font-mono leading-tight";
                                    statusMsg.innerText = "Spot reserved. Check your inbox on launch day.";
                                    emailInput.value = "";
                                }
                            } catch (err) {
                                statusMsg.className = "text-[#d18a8a] text-[10px] mt-2 font-mono leading-tight";
                                statusMsg.innerText = "Could not connect to server. Try again shortly.";
                            } finally {
                                submitBtn.disabled = false;
                                submitBtn.innerText = originalBtnText;
                            }
                        });
                    }
                };
                setTimeout(initWaitlist, 500);
            }, []);

            const showToast = (title, desc) => {
                setToast({ title, desc });
                setTimeout(() => setToast(null), 3000);
            };

            const scrollTo = (e, id) => {
                e.preventDefault();
                const el = document.getElementById(id);
                if (el) {
                    const yOffset = -80; 
                    const y = el.getBoundingClientRect().top + window.pageYOffset + yOffset;
                    window.scrollTo({top: y, behavior: 'smooth'});
                }
            };

            const handleGhostAction = (action) => {
                setGhostStatus(action);
                showToast(action === 'approved' ? 'Action Executed' : 'Action Terminated', 
                          action === 'approved' ? 'The terminal command was authorized.' : 'The terminal command was safely blocked.');
            };

            const containerVariants = {
                hidden: { opacity: 0 },
                show: {
                    opacity: 1,
                    transition: { staggerChildren: 0.15, delayChildren: 0.1 }
                }
            };

            const itemVariants = {
                hidden: { y: 20, opacity: 0 },
                show: { 
                    y: 0, 
                    opacity: 1,
                    transition: { duration: 0.8, ease: [0.16, 1, 0.3, 1] }
                }
            };

            return (
                <div className="min-h-screen font-sans selection:bg-aesAccent selection:text-aesText flex flex-col overflow-hidden relative">
                    
                    {/* Lightbox Overlay */}
                    <AnimatePresence>
                        {lightboxOpen && (
                            <motion.div 
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                exit={{ opacity: 0 }}
                                onClick={() => setLightboxOpen(false)}
                                className="fixed inset-0 z-[200] bg-black/95 backdrop-blur-md flex items-center justify-center p-4 md:p-12 cursor-zoom-out"
                            >
                                <motion.img 
                                    initial={{ scale: 0.95, opacity: 0 }}
                                    animate={{ scale: 1, opacity: 1 }}
                                    exit={{ scale: 0.95, opacity: 0 }}
                                    transition={{ type: "spring", damping: 25, stiffness: 300 }}
                                    src="./aurex_hero.jpg" 
                                    alt="Aurex Interface Fullscreen" 
                                    className="w-auto h-auto max-w-full max-h-full rounded-sm shadow-2xl border border-white/10"
                                />
                            </motion.div>
                        )}
                    </AnimatePresence>

                    <AnimatePresence>
                        {toast && (
                            <motion.div 
                                initial={{ opacity: 0, y: 50, x: '-50%' }}
                                animate={{ opacity: 1, y: 0, x: '-50%' }}
                                exit={{ opacity: 0, y: 20, x: '-50%' }}
                                className="fixed bottom-6 md:bottom-10 left-1/2 z-[100] bg-aesInvBase text-aesInvText px-6 py-4 md:px-8 md:py-5 rounded-sm shadow-2xl flex flex-col items-center w-[90%] max-w-sm text-center"
                            >
                                <span className="font-serif italic text-lg md:text-xl mb-1">{toast.title}</span>
                                {toast.desc && <span className="font-sans text-[9px] md:text-[10px] uppercase tracking-widest opacity-70">{toast.desc}</span>}
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* Mobile First Nav */}
                    <motion.nav 
                        initial={{ y: -20, opacity: 0 }}
                        animate={{ y: 0, opacity: 1 }}
                        transition={{ duration: 1, ease: "easeOut" }}
                        className="w-full px-5 py-6 md:px-8 md:py-8 flex items-center justify-between z-50 sticky top-0 bg-aesBase/90 backdrop-blur-md border-b border-transparent transition-colors duration-500"
                    >
                        <div className="flex items-center gap-4 md:gap-8 text-xs tracking-[0.2em] uppercase text-aesMuted">
                            <div className="flex items-center gap-3">
                                <motion.button 
                                    whileTap={{ scale: 0.9 }}
                                    whileHover={{ rotate: 15 }}
                                    onClick={() => setIsDark(!isDark)} 
                                    className="p-2 border border-aesBorder rounded-full hover:bg-aesAccent/20 transition-all flex items-center justify-center shrink-0"
                                    title="Toggle Theme"
                                >
                                    <AnimatePresence mode="wait">
                                        <motion.div
                                            key={isDark ? "dark" : "light"}
                                            initial={{ y: -5, opacity: 0, rotate: -45 }}
                                            animate={{ y: 0, opacity: 1, rotate: 0 }}
                                            exit={{ y: 5, opacity: 0, rotate: 45 }}
                                            transition={{ duration: 0.2 }}
                                        >
                                            {isDark ? (
                                                <svg className="w-3.5 h-3.5 md:w-4 md:h-4 text-aesText" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
                                            ) : (
                                                <svg className="w-3.5 h-3.5 md:w-4 md:h-4 text-aesText" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
                                            )}
                                        </motion.div>
                                    </AnimatePresence>
                                </motion.button>
                                <a 
                                    href="https://instagram.com/aurex_ai_os" 
                                    target="_blank" 
                                    rel="noopener noreferrer" 
                                    className="p-2 border border-aesBorder rounded-full hover:bg-aesAccent/20 transition-all flex items-center justify-center shrink-0" 
                                    title="Instagram"
                                >
                                    <svg className="w-3.5 h-3.5 md:w-4 md:h-4 text-aesText" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                                </a>
                            </div>
                            
                            <div className="hidden lg:flex gap-8">
                                <a href="#vision" onClick={(e) => scrollTo(e, 'vision')} className="hover:text-aesText transition-colors">Vision</a>
                                <a href="#features" onClick={(e) => scrollTo(e, 'features')} className="hover:text-aesText transition-colors">Features</a>
                            </div>
                        </div>
                        
                        <div 
                            className="text-2xl md:text-3xl font-serif tracking-widest uppercase font-medium absolute left-1/2 -translate-x-1/2 cursor-pointer"
                            onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})}
                        >
                            Aurex
                        </div>

                        <div className="flex gap-4 md:gap-8 items-center text-[10px] md:text-xs tracking-[0.2em] uppercase text-aesMuted">
                            <a href="#pricing" onClick={(e) => scrollTo(e, 'pricing')} className="hover:text-aesText transition-colors hidden md:block">Pricing</a>
                            <button 
                                onClick={(e) => scrollTo(e, 'pricing')}
                                className="text-aesText border-b border-aesText pb-0.5 md:pb-1 hover:text-aesMuted hover:border-aesMuted transition-all text-center whitespace-nowrap"
                            >
                                Secure Spot
                            </button>
                        </div>
                    </motion.nav>

                    <main className="flex-1 w-full max-w-7xl mx-auto px-5 md:px-12 pt-10 md:pt-24 pb-20 md:pb-32">
                        
                        <motion.section 
                            id="vision"
                            variants={containerVariants}
                            initial="hidden"
                            animate="show"
                            className="flex flex-col items-center text-center max-w-4xl mx-auto pt-4 md:pt-8"
                        >
                            <motion.div variants={itemVariants} className="flex items-center gap-2 md:gap-3 border border-red-900/30 bg-red-900/5 px-3 py-1 md:px-4 md:py-1.5 rounded-full mb-6 md:mb-8">
                                <span className="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-red-700 animate-pulse"></span>
                                <span className="text-[8px] md:text-[10px] font-sans uppercase tracking-[0.2em] text-aesText opacity-80">Strictly Limited Early Beta</span>
                            </motion.div>
                            
                            <motion.h1 variants={itemVariants} className="text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-serif leading-[1.1] mb-5 md:mb-6 font-light text-aesText px-2">
                                The OS that actually does the work. <br/>
                                <span className="italic text-aesMuted block mt-1 md:mt-0 md:inline">Safely.</span>
                            </motion.h1>
                            
                            <motion.p variants={itemVariants} className="font-sans font-light text-aesMuted text-base md:text-xl max-w-2xl leading-relaxed mb-6 md:mb-6 px-4">
                                A local-first, BYOK desktop agent that reads your codebase, executes terminal commands, and manages your files—but never acts without your permission.
                            </motion.p>

                            <motion.div variants={itemVariants} className="flex flex-col items-center mb-10 md:mb-10">
                                <div className="flex -space-x-2 md:-space-x-3 mt-2 md:mt-4 mb-3 opacity-90">
                                    <img src="https://i.pravatar.cc/100?img=68" className="w-8 h-8 md:w-9 md:h-9 rounded-full border-2 border-aesBase" />
                                    <img src="https://i.pravatar.cc/100?img=33" className="w-8 h-8 md:w-9 md:h-9 rounded-full border-2 border-aesBase" />
                                    <img src="https://i.pravatar.cc/100?img=12" className="w-8 h-8 md:w-9 md:h-9 rounded-full border-2 border-aesBase" />
                                    <img src="https://i.pravatar.cc/100?img=47" className="w-8 h-8 md:w-9 md:h-9 rounded-full border-2 border-aesBase" />
                                    <div className="w-8 h-8 md:w-9 md:h-9 rounded-full border-2 border-aesBase bg-aesSurface text-aesText flex items-center justify-center text-[7px] md:text-[8px] font-bold z-10 shadow-sm">+4k</div>
                                </div>
                                <span className="text-[9px] md:text-[10px] font-sans uppercase tracking-widest text-aesMuted text-center max-w-[200px] md:max-w-none">Join 4,209 developers waiting for V1.0</span>
                            </motion.div>
                            
                            <motion.div variants={itemVariants} className="w-full sm:w-auto px-4 sm:px-0 relative">
                                <motion.button 
                                    whileHover={{ scale: 1.02, backgroundColor: "var(--aes-text)", color: "var(--aes-base)" }} 
                                    whileTap={{ scale: 0.98 }} 
                                    onClick={(e) => scrollTo(e, 'pricing')}
                                    className="w-full sm:w-auto px-6 md:px-12 py-4 md:py-5 bg-aesInvBase text-aesInvText text-xs md:text-sm uppercase tracking-widest transition-all shadow-[0_10px_40px_rgba(0,0,0,0.15)] relative overflow-hidden group"
                                >
                                    <span className="relative z-10 flex items-center justify-center gap-2">Pre-Book Beta Access <svg className="w-3.5 h-3.5 md:w-4 md:h-4 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 8l4 4m0 0l-4 4m4-4H3" /></svg></span>
                                </motion.button>
                            </motion.div>
                        </motion.section>

                        <motion.section 
                            initial={{ opacity: 0, y: 30 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ duration: 1.5, ease: [0.16, 1, 0.3, 1] }}
                            className="mt-20 md:mt-32 w-full flex justify-center px-2 md:px-0"
                        >
                            <div className="w-full max-w-5xl relative group overflow-hidden rounded-sm border border-aesBorder bg-aesSurface shadow-[0_4px_40px_rgba(0,0,0,0.03)] hover:shadow-2xl transition-shadow duration-700">
                                <motion.img 
                                    whileHover={{ scale: 1.01 }}
                                    transition={{ duration: 0.5, ease: "easeOut" }}
                                    src="./aurex_hero.jpg" 
                                    alt="Aurex Interface" 
                                    className="w-full h-auto object-contain cursor-zoom-in max-h-[80vh]"
                                    onClick={() => setLightboxOpen(true)}
                                />
                                <div className="absolute inset-0 bg-black/10 transition-opacity duration-500 group-hover:bg-black/0 pointer-events-none"></div>
                                <div className="absolute bottom-4 left-4 md:bottom-8 md:left-8 text-white text-[10px] md:text-sm font-sans tracking-widest uppercase flex items-center gap-3 md:gap-4 pointer-events-none">
                                    <span className="w-6 md:w-8 h-[1px] bg-white block shadow-lg"></span>
                                    <span className="drop-shadow-md">Aurex Interface</span>
                                </div>
                            </div>
                        </motion.section>

                        <section id="features" className="mt-32 md:mt-56 scroll-mt-32">
                            <motion.div 
                                initial={{ opacity: 0, y: 30 }}
                                whileInView={{ opacity: 1, y: 0 }}
                                viewport={{ once: true, margin: "-100px" }}
                                transition={{ duration: 1 }}
                                className="flex flex-col md:flex-row justify-between items-start mb-16 md:mb-24 border-b border-aesBorder pb-8 md:pb-12"
                            >
                                <h2 className="text-3xl md:text-5xl font-serif font-light text-aesText">Features</h2>
                                <p className="font-sans text-aesMuted font-light max-w-md mt-4 md:mt-0 text-base md:text-lg">
                                    An advanced, multi-modal architecture elevating the local developer experience.
                                </p>
                            </motion.div>

                            <motion.div 
                                variants={containerVariants}
                                initial="hidden"
                                whileInView="show"
                                viewport={{ once: true, margin: "-50px" }}
                                className="grid grid-cols-1 md:grid-cols-2 gap-x-12 md:gap-x-20 gap-y-12 md:gap-y-16"
                            >
                                {[
                                    { num: "01", title: "Model Fabric & Auto-Failover", desc: "Dynamically routes tasks to the best local or cloud models. Transparently detects billing limits and auto-negotiates budgets or failovers instantly." },
                                    { num: "02", title: "Obsidian Knowledge Graph", desc: "Bidirectional Obsidian vault sync powered by ChromaDB vector similarity. Interactive visual graphs with auto-prompted ghost links." },
